profile_id = "hikvision-hik-v1.0"
profile_version = "2.0.0"
schema_version = "1.0"
oem = "hikvision"
storage_family = "HIKVISION_FS"

[applicability]
# Models the identifier + HIKBTREE layout below has been exercised against as a
# *structure set*. This is a statement about the on-disk layout, not a compatibility
# claim for any firmware: see `reference` and the uncertainty notes at the end of the
# [layout] table.
models = ["DS-7204", "DS-7208", "DS-7216", "DS-7604", "DS-7608", "DS-7616", "DS-8604", "DS-8616"]
firmwares = []
storage_variants = ["single_disk", "raid"]
reference = "Clean-room reverse-engineered Hikvision recorder filesystem layout: boot identifier block, HIKBTREE page index, 1 GiB video blocks with a trailing 1 MiB clip index footer, and an MPEG-PS/PES-derived clip container. Structure facts only; no vendor source or third-party tool method bodies were used."

# =================================================================================
# Signatures
# =================================================================================
#
# Only `hikvision_boot_identifier` and `hikbtree_magic` carry attribution weight. Every
# other rule below exists so the PARSER can verify a structure it located through the
# filesystem's own pointers; those carry weight 0.01 and `is_exclusive = false` so they
# never perturb detection scoring.

# The Hikvision filesystem identifier. It is a 32-byte field at boot_identifier_offset
# inside the boot structure, whose first 18 bytes are the ASCII string
# "HIKVISION@HANGZHOU". The pattern is the string alone: the remaining bytes of the
# field vary between recorders and the platform has no evidence for their content, so
# matching them would reject volumes that are genuinely Hikvision.
[[signatures]]
name = "hikvision_boot_identifier"
pattern_hex = "48 49 4B 56 49 53 49 4F 4E 40 48 41 4E 47 5A 48 4F 55" # "HIKVISION@HANGZHOU"
evidence_status = "validated"
weight = 0.85
is_exclusive = true
explanation = "Hikvision filesystem identifier, 32-byte field at boot structure offset +16. Observed at boot positions 0x200 and 0x4C56000, i.e. absolute offsets 0x210 and 0x4C56010."

# Boot position 0x200 (512) + identifier offset 16.
[[signatures.offset_constraints]]
type = "exact"
offset = 528

# Boot position 0x4C56000 (80044032) + identifier offset 16.
[[signatures.offset_constraints]]
type = "exact"
offset = 80044048

# The HIKBTREE index header magic. Corroborates the identifier, because a volume that
# carries the identifier *and* a structurally locatable index is Hikvision rather than a
# fragment of one. Located through the boot structure's own BTreeOffset field, so its
# offset constraint is a bound on where a tree may live, not a scan instruction.
[[signatures]]
name = "hikbtree_magic"
pattern_hex = "48 49 4B 42 54 52 45 45" # "HIKBTREE"
evidence_status = "validated"
weight = 0.40
is_exclusive = false
explanation = "Hikvision HIKBTREE index header magic, located via the boot structure's BTreeOffset / BackupBTreeOffset fields."

[[signatures.offset_constraints]]
type = "aligned_range"
start = 0
end = 137438953472 # 128 GiB structural bound on where a tree pointer may land
alignment = 4096

# The OFNI information part that appears inside a Hikvision clip's MPEG-PS-like stream.
# Verified at a part boundary reached by walking the stream, never by scanning.
[[signatures]]
name = "hikvision_ofni_part"
pattern_hex = "4F 46 4E 49" # "OFNI"
evidence_status = "provisional"
weight = 0.01
is_exclusive = false
explanation = "Hikvision OFNI information part tag inside a clip stream, with a little-endian i32 length at +4. Parsed as metadata evidence; not used for OEM attribution."

# MPEG-PS / PES start codes used by the Hikvision clip container. These are MPEG
# standard start codes, not Hikvision-unique values, so they carry no attribution
# weight whatsoever: finding one proves nothing about the OEM.
[[signatures]]
name = "ps_pack_header"
pattern_hex = "00 00 01 BA"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS pack header start code (0x1BA). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_system_header"
pattern_hex = "00 00 01 BB"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS system header start code (0x1BB). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_program_stream_map"
pattern_hex = "00 00 01 BC"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS program stream map start code (0x1BC). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_private_stream_1"
pattern_hex = "00 00 01 BD"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS private stream 1 start code (0x1BD). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_audio_stream_0"
pattern_hex = "00 00 01 C0"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS audio stream 0 start code (0x1C0). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_video_stream_0"
pattern_hex = "00 00 01 E0"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS video stream 0 start code (0x1E0). Standard MPEG value; carries no OEM attribution weight."

[[signatures]]
name = "ps_video_stream_1"
pattern_hex = "00 00 01 E1"
evidence_status = "validated"
weight = 0.01
is_exclusive = false
explanation = "MPEG-PS video stream 1 start code (0x1E1). Standard MPEG value; carries no OEM attribution weight."

# Structural sentinel observed preceding recoverable Hikvision stream data in
# unindexed space. Deliberately `provisional` and weight 0.01: it is ONE clue used by
# the raw carver alongside frame-structure, length and timestamp validation, and is
# never sufficient on its own to declare a recording.
[[signatures]]
name = "hikvision_carve_sentinel"
pattern_hex = "FF FF FF FB"
evidence_status = "provisional"
weight = 0.01
is_exclusive = false
explanation = "Structural sentinel observed adjacent to Hikvision stream data in unindexed regions. One corroborating clue for the raw carver, never a sufficient condition; not used for OEM attribution."

# =================================================================================
# Validation rules
# =================================================================================

[[validation_rules]]
name = "boot_identifier_present"
description = "A 32-byte identifier field at boot +16 begins with the Hikvision filesystem identifier string."
evidence_status = "validated"
weight = 0.85

[[validation_rules]]
name = "boot_offsets_within_image"
description = "VideoStartOffset, BTreeOffset and BackupBTreeOffset all resolve inside the acquired image."
evidence_status = "validated"
weight = 0.30

[[validation_rules]]
name = "hikbtree_header_verified"
description = "The page at BTreeOffset carries the HIKBTREE magic and a page count consistent with the declared tree size."
evidence_status = "validated"
weight = 0.40

[[validation_rules]]
name = "hikbtree_traversal_complete"
description = "Page traversal from FirstLeafPageOffset visited every declared page without a cycle, a duplicate, an out-of-range pointer or an unknown page type."
evidence_status = "validated"
weight = 0.30

[[validation_rules]]
name = "btree_entry_sentinel_consistent"
description = "Each 48-byte entry's +8 field is either the blank sentinel or the populated value; any other value marks the entry malformed."
evidence_status = "validated"
weight = 0.20

[[validation_rules]]
name = "block_footer_clip_index_valid"
description = "A video block's trailing footer carries a clip index whose header byte is not the reject value and whose clip count is greater than zero."
evidence_status = "provisional"
weight = 0.25

[[validation_rules]]
name = "clip_range_within_video_data"
description = "A clip's computed physical range falls inside the video-data portion of its block, never inside the footer."
evidence_status = "validated"
weight = 0.25

[[validation_rules]]
name = "clip_duration_plausible"
description = "A clip's end time is at or after its start time and the span does not exceed the maximum plausible clip duration."
evidence_status = "provisional"
weight = 0.15

[[validation_rules]]
name = "ps_part_lengths_consistent"
description = "Every MPEG-PS/PES part in a clip declares a length that stays inside the clip and a payload offset inside its own part."
evidence_status = "validated"
weight = 0.30

[[validation_rules]]
name = "backup_tree_agreement"
description = "Where both the primary and the backup HIKBTREE parse, their entry sets agree. Disagreement is preserved, never merged away."
evidence_status = "validated"
weight = 0.20

[confidence_weights]
max_possible_score = 1.25
min_threshold = 0.65

# =================================================================================
# Structural layout
# =================================================================================
#
# Byte offsets, strides, sizes, sentinels and bounds of the Hikvision on-disk
# structures. These are OEM facts and therefore live here as versioned profile DATA,
# never as Rust source constants.
#
# Endianness is stated per field. Hikvision mixes little-endian structure fields with
# big-endian MPEG-PS fields, so the two are labelled explicitly throughout.
#
# Any offset NOT listed here is one the platform has no evidence for; the parser
# reports the corresponding field as Unknown rather than guessing.
[layout]

# ── Boot structure ───────────────────────────────────────────────────────────────
#
# All boot field offsets are relative to the DETECTED boot position, not to the start
# of the image. Two boot positions have been observed; the parser tries each and
# records which one produced the identifier.
boot_candidate_offset_primary = 512        # 0x200
boot_candidate_offset_secondary = 80044032 # 0x4C56000
boot_structure_size = 512
boot_identifier_offset = 16
boot_identifier_field_size = 32
boot_video_start_offset_offset = 120       # i64 LE
boot_block_size_offset = 136               # i64 LE
boot_number_of_blocks_offset = 144         # i32 LE
boot_btree_offset_offset = 152             # i64 LE
boot_btree_size_offset = 160               # i64 LE
boot_backup_btree_offset_offset = 168      # i64 LE
boot_backup_btree_size_offset = 176        # i64 LE

# Fallbacks used ONLY when the boot structure explicitly requires them, i.e. when the
# field is present but declares zero. A field that declares an out-of-bounds or
# otherwise impossible value is reported malformed rather than replaced.
boot_video_start_offset_fallback = 80117760 # 0x4C64000
boot_block_size_default = 1073741824        # 1 GiB
# Structural sanity bounds on the declared block geometry.
boot_block_size_min = 1048576               # 1 MiB; a block must exceed its own footer
boot_block_size_max = 68719476736           # 64 GiB
boot_number_of_blocks_max = 1048576

# ── HIKBTREE header ──────────────────────────────────────────────────────────────
#
# Offsets are relative to the start of the tree header page, which sits at the boot
# structure's BTreeOffset (or BackupBTreeOffset for the backup tree).
hikbtree_page_size = 4096
hikbtree_magic_length = 8
hikbtree_magic_offset = 0
hikbtree_tree_timestamp_offset = 60         # i32 LE, unix seconds
hikbtree_first_pointer_page_offset = 64     # i64 LE
hikbtree_last_pointer_page_offset = 72      # i64 LE
hikbtree_first_list_page_offset = 80        # i64 LE
hikbtree_first_leaf_page_offset = 88        # i64 LE
hikbtree_page_count_offset = 96             # i32 LE
hikbtree_page_count_max = 1048576
# Upper bound on pages one traversal will visit. This is a loop guard against a
# hostile or damaged tree, not a semantic limit: it is deliberately at least as large
# as hikbtree_page_count_max so no well-formed tree is ever truncated by it.
hikbtree_traversal_max_pages = 1048576

# ── HIKBTREE page header ─────────────────────────────────────────────────────────
#
# Page type discriminators and the per-type pointer/entry layout. Offsets are relative
# to the start of a page.
hikbtree_page_type_offset = 0               # i32 LE
hikbtree_page_type_leaf = 2
hikbtree_page_type_internal = 3
# Leaf page.
hikbtree_leaf_entry_count_offset = 16       # i32 LE
hikbtree_leaf_other_page_offset = 24        # i64 LE
hikbtree_leaf_next_page_offset = 32         # i64 LE
hikbtree_leaf_entries_offset = 96
# Internal page.
hikbtree_internal_other_page_offset = 16    # i64 LE
hikbtree_internal_next_page_offset = 24     # i64 LE
# A leaf can declare no more entries than physically fit between the entry array base
# and the end of the page. Derived value recorded explicitly so the bound is auditable:
#   (4096 - 96) / 48 = 83
hikbtree_leaf_entry_count_max = 83

# ── HIKBTREE entry ───────────────────────────────────────────────────────────────
#
# A 48-byte record. The +8 field is a state sentinel, not a length or a pointer: it is
# either the blank value (slot never written) or the populated value (slot in use).
# Anything else is evidence the entry is malformed or has been partially overwritten,
# and is preserved as such rather than coerced into one of the two known states.
hikbtree_entry_size = 48
hikbtree_entry_page_offset_offset = 0       # i64 LE
hikbtree_entry_sentinel_offset = 8          # u64 LE
hikbtree_entry_channel_offset = 17          # u8
hikbtree_entry_start_time_offset = 24       # i32 LE, unix seconds
hikbtree_entry_end_time_offset = 28         # i32 LE, unix seconds
hikbtree_entry_data_offset_offset = 32      # i64 LE
hikbtree_entry_status_offset = 40           # i32 LE, preserved raw
hikbtree_entry_unknown_offset = 44          # i32 LE, preserved raw
# Sentinel values. TOML integers are signed 64-bit, so the all-ones blank sentinel is
# recorded as -1; the parser reinterprets it as the unsigned 0xFFFFFFFFFFFFFFFF.
hikbtree_entry_sentinel_blank = -1          # 0xFFFFFFFFFFFFFFFF
hikbtree_entry_sentinel_populated = 0
# Channel plausibility. A raw value above this bound is reported as an implausible
# channel rather than silently truncated.
hikbtree_entry_channel_max = 127
# Value added to the raw channel byte to produce the 1-based channel number shown to an
# examiner. The observed structures record the channel 0-based, so the addend is 1.
#
# PROVISIONAL: firmware variation in the channel encoding has not been ruled out. The
# parser therefore always preserves the raw byte and records which encoding it applied,
# so a normalization that turns out to be wrong for some model is visible in the
# evidence rather than baked invisibly into a channel number.
hikvision_channel_normalization_addend = 1

# ── Video block geometry ─────────────────────────────────────────────────────────
#
# A video block is BlockSize bytes. Its trailing footer region holds the block's clip
# index. Video payload therefore occupies
#   [blockOffset, blockOffset + BlockSize - block_footer_size)
# and the index occupies
#   [blockOffset + BlockSize - block_footer_size, blockOffset + BlockSize).
# The footer is never scanned as video data.
block_footer_size = 1048576 # 1 MiB

# ── Block footer clip index ──────────────────────────────────────────────────────
#
# Offsets are relative to the start of the footer region.
block_index_header_size = 512
block_index_reject_byte_offset = 13         # u8; block_index_reject_byte_value => not an index
block_index_reject_byte_value = 255
block_index_clip_count_offset = 20          # u16 LE; must be > 0
block_index_epoch_start_offset = 32         # u32 LE, unix seconds
block_index_epoch_end_offset = 36           # u32 LE, unix seconds
# Clip slot array. The first slot begins immediately after the header.
block_index_clip_base_offset = 512
block_index_clip_stride = 512
# Upper bound on declared clips, derived from the footer geometry:
#   (1048576 - 512) / 512 = 2047
block_index_clip_count_max = 2047

# ── Clip slot fields ─────────────────────────────────────────────────────────────
#
# Offsets are relative to the start of a clip slot.
clip_channel_offset = 13                    # u8; > clip_channel_max => reject slot
clip_channel_max = 127
clip_time_a_offset = 40                     # u32 LE, unix seconds; fallback start time
clip_end_time_offset = 48                   # u32 LE, unix seconds; required
clip_start_time_offset = 56                 # u32 LE, unix seconds; falls back to time A
clip_start_offset_offset = 72               # u32 LE, from the block start
clip_end_offset_offset = 76                 # u32 LE, from the block start; must exceed start
clip_frame_rate_offset = 88                 # u8
# Fields whose meaning the platform has not established. They are preserved verbatim
# in the clip's metadata rather than discarded, so a later revision can interpret them
# without re-acquiring evidence.
clip_unknown_a_offset = 108                 # u32 LE
clip_unknown_b_offset = 112                 # u32 LE
# Maximum plausible span for a single clip. A slot declaring more is reported as an
# implausible duration and excluded from the accessible set.
clip_max_duration_seconds = 604800          # 7 days
clip_min_length_bytes = 1

# ── Timestamps ───────────────────────────────────────────────────────────────────
#
# Hikvision records unix epoch seconds. No timezone is stored anywhere in these
# structures, so none is applied at parse time; zone formatting is a presentation
# concern. `incomplete` marks a recording the recorder had not finished writing.
hikvision_timestamp_epoch_base = 0
hikvision_timestamp_incomplete_value = 2147483647 # i32::MAX
# Plausibility window for a decoded recorder clock, as unix seconds. Outside it the
# value is reported with low confidence rather than dropped or clamped.
hikvision_timestamp_plausible_min = 946684800     # 2000-01-01T00:00:00Z
hikvision_timestamp_plausible_max = 4102444800    # 2100-01-01T00:00:00Z

# ── MPEG-PS / PES clip container ─────────────────────────────────────────────────
#
# The clip payload is an MPEG-PS-like byte stream. Start codes are the standard
# 00 00 01 xx sequences; the stream-id byte follows. All multi-byte fields inside PS
# and PES headers are BIG-endian, unlike the little-endian filesystem structures above.
ps_start_code_prefix_length = 3
ps_start_code_length = 4
# Stream ids, as the full 32-bit start code value (0x000001xx).
ps_tag_pack_header = 442                    # 0x1BA
ps_tag_system_header = 443                  # 0x1BB
ps_tag_program_stream_map = 444             # 0x1BC
ps_tag_private_stream_1 = 445               # 0x1BD
ps_tag_audio_stream_0 = 448                 # 0x1C0
ps_tag_video_stream_0 = 480                 # 0x1E0
ps_tag_video_stream_1 = 481                 # 0x1E1
# Pack header (0x1BA): a fixed-size structure carrying a sequence serial.
ps_pack_header_size = 20
ps_pack_serial_offset = 16                  # u32 BE
# PES-like parts (0x1BB, 0x1BC, 0x1BD, 0x1C0, 0x1E0, 0x1E1):
#   partLength    = u16BE at +4, plus 6 for the start code and the length field itself
#   payloadOffset = (u16BE at +7 & 0xFFF) + 9
ps_pes_length_offset = 4                    # u16 BE
ps_pes_length_addend = 6
ps_pes_payload_offset_field = 7             # u16 BE
ps_pes_payload_offset_mask = 4095           # 0xFFF
ps_pes_payload_offset_addend = 9
ps_pes_min_part_length = 6
ps_pes_max_part_length = 1048576
# Upper bound on parts walked in one clip, guarding against a damaged stream that
# would otherwise produce unbounded output.
ps_max_parts_per_clip = 1048576

# ── OFNI information part ────────────────────────────────────────────────────────
#
# Not an MPEG start code: a 4-byte "OFNI" tag with its own little-endian length.
ofni_tag_length = 4
ofni_length_offset = 4                      # i32 LE
ofni_length_addend = 8                      # tag + length field
ofni_max_length = 65536

# ── Codec detection ──────────────────────────────────────────────────────────────
#
# Codec identity is established from NAL structure inside video PES payloads, never
# from a single signature. These are the Annex-B NAL facts needed to do that; the
# scoring itself is parser logic, not OEM data.
nal_h264_type_mask = 31                     # 0x1F, nal_unit_type in the low 5 bits
nal_h264_type_sps = 7
nal_h264_type_pps = 8
nal_h264_type_idr = 5
nal_h264_type_non_idr = 1
nal_h264_type_sei = 6
nal_h264_type_aud = 9
nal_h265_type_mask = 126                    # 0x7E, nal_unit_type in bits 1..6
nal_h265_type_shift = 1
nal_h265_type_vps = 32
nal_h265_type_sps = 33
nal_h265_type_pps = 34
nal_h265_type_idr_w_radl = 19
nal_h265_type_idr_n_lp = 20
nal_h265_type_trail_r = 1
nal_h265_type_aud = 35
# Minimum number of independently agreeing NAL observations before a codec is
# reported as determined. Below it the codec is Unknown; it is never fabricated.
codec_min_agreeing_nals = 2

# ── Bounded scanning ─────────────────────────────────────────────────────────────
#
# Performance knobs, never semantic limits. A structure whose declared length exceeds
# a window is still described in full and the next window resumes past its end, so a
# large recording is never truncated by a scan boundary.
hikvision_read_window_bytes = 4194304       # 4 MiB streaming read window
hikvision_carve_window_bytes = 4194304
hikvision_carve_window_overlap_bytes = 512  # >= the largest structure straddling a boundary
# Upper bound on candidates described from one scan region. Deliberately large: a
# region may legitimately contain many candidates, and assuming one per window was a
# defect in the previous implementation.
hikvision_carve_max_candidates_per_region = 65536
# Probe size used by recognize_candidate. Enough to reach a pack header plus a PES
# part, so recognition rests on structure rather than on a lone signature.
hikvision_recognition_probe_bytes = 65536
# ── Raw carving corroboration ────────────────────────────────────────────────────
#
# A carved candidate must satisfy several independent conditions, never just the
# sentinel. These knobs say how many and how strict.
#
# Minimum container parts a candidate must contain. One lone start code is not a
# recording.
hikvision_carve_min_parts = 3
# Minimum number of independent corroborating conditions a candidate must satisfy out of
# the seven the carver evaluates (region, framing, tags, lengths, boundary, codec,
# sentinel proximity). Below this the candidate is described but not reported as a
# recoverable recording.
hikvision_carve_min_conditions = 4
# How close the FF FF FF FB sentinel must be to a candidate's start for its presence to
# count as corroboration. Absence is NOT disqualifying: the sentinel is one clue.
hikvision_carve_sentinel_proximity_bytes = 65536

# ── Recording grouping ───────────────────────────────────────────────────────────
#
# Maximum gap, in seconds, between one clip's end and the next clip's start for the two
# to be treated as parts of the same continuous recording. Recorders write consecutive
# clips back to back, so a small tolerance absorbs rounding without joining unrelated
# recordings.
hikvision_recording_join_gap_seconds = 5

# ── Annex-B normalization ────────────────────────────────────────────────────────
#
# How much of a reconstructed stream's payload prefix is scanned for the leading start code
# and for SPS/PPS/VPS placement before export. A bounded prefix: that is where a decoder
# needs its parameter sets, and it keeps normalization from reading a whole recording.
hikvision_annexb_normalize_scan_bytes = 8388608   # 8 MiB

# Upper bound on how many video blocks one volume read will enumerate footers for.
# This is a loop guard against a boot structure that declares an absurd block count, not
# a semantic limit: the real bound is how many blocks the acquired image can hold, and
# blocks past the end of the evidence are reported out-of-scope rather than skipped
# silently. Deliberately at least boot_number_of_blocks_max.
hikvision_max_blocks_examined = 1048576

# ── Firmware / layout uncertainty ────────────────────────────────────────────────
#
# Recorded as data so a report can surface it. 1 = the platform treats the value as
# established from structure; 0 = provisional, interpretation may differ per firmware.
#
# established:
uncertainty_boot_identifier_established = 1
uncertainty_btree_page_layout_established = 1
uncertainty_entry_layout_established = 1
uncertainty_block_footer_geometry_established = 1
uncertainty_ps_framing_established = 1
# provisional — interpretation not confirmed across firmware revisions:
uncertainty_channel_encoding_established = 0
uncertainty_clip_slot_field_semantics_established = 0
uncertainty_entry_status_semantics_established = 0
uncertainty_carve_sentinel_semantics_established = 0
uncertainty_allocation_state_available = 0
