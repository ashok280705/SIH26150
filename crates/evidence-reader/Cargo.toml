[package]
name = "evidence-reader"
description = "Read-only, bounded, streaming access to evidence images and physical disks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database. OS handles only, always read-only.
[dependencies]
forensic-core = { path = "../forensic-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }


