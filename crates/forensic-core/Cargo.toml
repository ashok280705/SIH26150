[package]
name = "forensic-core"
description = "Shared forensic domain types, identifiers, error types, and traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure domain crate: no network, no database, no environment coupling.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

# Pinned to 1.9.0: the newest 1.11.x declares MSRV 1.85, but this workspace targets
# rust-version 1.82. 1.9.0 is the latest release compatible with that MSRV.
[dev-dependencies]
proptest = "=1.9.0"

