[package]
name = "reporting"
description = "Forensic reporting: PDF/JSON/CSV output with hashes, provenance, and limitations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database.
[dependencies]
forensic-core = { path = "../forensic-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
