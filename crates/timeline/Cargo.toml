[package]
name = "timeline"
description = "Timeline engine: timestamp normalization, unification, and cross-camera correlation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database.
[dependencies]
forensic-core = { path = "../forensic-core" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
