[package]
name = "parser-dahua"
description = "Dahua OEM parser: profile-driven filesystem, metadata, recording, and timestamp interpretation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database. OEM facts come from profiles/dahua/.
[dependencies]
forensic-core = { path = "../../forensic-core" }
evidence-reader = { path = "../../evidence-reader" }
parsers-core = { path = "../../parsers-core" }
hex = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
forensic-tests = { path = "../../../tests" }
tempfile = "3"
