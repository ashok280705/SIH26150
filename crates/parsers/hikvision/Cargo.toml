[package]
name = "parser-hikvision"
description = "Hikvision OEM parser: profile-driven storage, metadata, index, and recording interpretation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database. OEM facts come from profiles/hikvision/.
[dependencies]
forensic-core = { path = "../../forensic-core" }
evidence-reader = { path = "../../evidence-reader" }
parsers-core = { path = "../../parsers-core" }
hex = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
forensic-tests = { path = "../../../tests" }
tempfile = "3"
