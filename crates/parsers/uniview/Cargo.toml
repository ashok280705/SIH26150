[package]
name = "parser-uniview"
description = "Uniview OEM parser: profile-driven SUPER, UI/UI-CTL, UI-DATA, unit/DI index, SPtoI-to-DATA resolution, raw DATA extraction and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Pure core crate: no network, no database. OEM facts come from profiles/uniview/.
[dependencies]
forensic-core = { path = "../../forensic-core" }
evidence-reader = { path = "../../evidence-reader" }
parsers-core = { path = "../../parsers-core" }
hex = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
