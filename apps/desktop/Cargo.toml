[package]
name = "vidforge-desktop"
description = "VIDFORGE Windows Forensic Workstation Desktop Application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
forensic-api = { path = "../api" }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", default-features = false }
