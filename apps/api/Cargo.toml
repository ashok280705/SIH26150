[package]
name = "forensic-api"
description = "Axum/Tokio HTTP API. The only crate permitted to touch the network and the database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "forensic_api"
path = "src/lib.rs"

[[bin]]
name = "forensic-api"
path = "src/main.rs"


[dependencies]
forensic-core = { path = "../../crates/forensic-core" }
evidence-reader = { path = "../../crates/evidence-reader" }
hashing = { path = "../../crates/hashing" }
detection = { path = "../../crates/detection" }
confidence = { path = "../../crates/confidence" }
parsing = { path = "../../crates/parsing" }
recovery = { path = "../../crates/recovery" }
timeline = { path = "../../crates/timeline" }
pipeline = { path = "../../crates/pipeline" }
reporting = { path = "../../crates/reporting" }
tplink = { path = "../../crates/parsers/tplink" }
# Needed only for OEM recording-chain reconstruction on export: a Dahua recording spans
# several 2 MiB blocks and its stream is a list of frame payload ranges, which the generic
# `Parser` interface deliberately does not expose. See `reconstruct_oem_chain`.
parser-dahua = { path = "../../crates/parsers/dahua" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "uuid", "chrono", "json"] }
