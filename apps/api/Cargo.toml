[package]
name = "forensic-api"
description = "Axum/Tokio HTTP API. The only crate permitted to touch the network and the database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "forensic_api"
path = "src/lib.rs"

[[bin]]
name = "forensic-api"
path = "src/main.rs"


[dependencies]
forensic-core = { path = "../../crates/forensic-core" }
evidence-reader = { path = "../../crates/evidence-reader" }
acquisition = { path = "../../crates/acquisition" }
hashing = { path = "../../crates/hashing" }
detection = { path = "../../crates/detection" }
confidence = { path = "../../crates/confidence" }
parsing = { path = "../../crates/parsing" }
recovery = { path = "../../crates/recovery" }
# The downstream media subsystem: validation, FFmpeg decode, standardized frames, image
# processing and the AI boundary. It carries no OEM knowledge, so wiring it here does not
# give the API a second route into parser behaviour.
media = { path = "../../crates/media" }
timeline = { path = "../../crates/timeline" }
pipeline = { path = "../../crates/pipeline" }
reporting = { path = "../../crates/reporting" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "uuid", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
