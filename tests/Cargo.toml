[package]
name = "forensic-tests"
description = "Cross-crate integration tests, workspace layout assertions, and synthetic fixture generators."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test-support crate: no network, no database. Layout assertions use std only.
[dependencies]
forensic-core = { path = "../crates/forensic-core" }
evidence-reader = { path = "../crates/evidence-reader" }
hashing = { path = "../crates/hashing" }
detection = { path = "../crates/detection" }
confidence = { path = "../crates/confidence" }
forensic-api = { path = "../apps/api" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }




[dev-dependencies]
parser-dahua = { path = "../crates/parsers/dahua" }
parser-hikvision = { path = "../crates/parsers/hikvision" }
parser-honeywell = { path = "../crates/parsers/honeywell" }
parser-cpplus-ubs = { path = "../crates/parsers/cpplus-ubs" }
parser-uniview = { path = "../crates/parsers/uniview" }
parsers-core = { path = "../crates/parsers-core" }
tempfile = "3"

[[bin]]
name = "generate_corpus"
path = "src/bin/generate_corpus.rs"
